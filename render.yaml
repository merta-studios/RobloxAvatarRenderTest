services:
  - type: web
    name: roblox-avatar-render-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: ROBLOX_OPENCLOUD_API_KEY
        sync: false
      - key: RENDER_TIMEOUT_SECONDS
        value: "420"
      - key: MAX_ASSET_MB
        value: "30"
      - key: REST_TIMEOUT_SECONDS
        value: "20"
      - key: LOGIN_TIMEOUT_SECONDS
        value: "90"
      - key: LOGIN_ATTEMPTS
        value: "0"
      - key: LOGIN_BACKOFF_SECONDS
        value: "5"
      - key: LOGIN_BACKOFF_MAX_SECONDS
        value: "300"
      - key: DNS_RESULT_ORDER
        value: ipv4first
      - key: HEALTH_REQUIRE_DISCORD
        value: "false"
      - key: DISCORD_DEBUG
        value: "false"
