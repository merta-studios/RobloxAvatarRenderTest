services:
  - type: web
    name: roblox-avatar-render-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: RENDER_TIMEOUT_SECONDS
        value: "420"
      - key: MAX_ASSET_MB
        value: "30"
      - key: REST_TIMEOUT_SECONDS
        value: "30"
      - key: LOGIN_TIMEOUT_SECONDS
        value: "60"
      - key: HEALTH_REQUIRE_DISCORD
        value: "true"
      - key: DISCORD_DEBUG
        value: "false"
